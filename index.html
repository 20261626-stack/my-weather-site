<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합 날씨 대시보드 (한글 검색 완벽 지원)</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #4A90E2;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e6e6e6;
            --card-bg: #16213e;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }

        .main-weather {
            text-align: center;
        }
        .temp { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        .desc { font-size: 1.2rem; margin-bottom: 10px; }

        .grid-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-item {
            background: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .lifestyle-guide {
            border-left: 4px solid var(--primary-color);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="controls">
        <input type="text" id="searchInput" placeholder="지역 검색 (예: 부산, 강남구, 제주도)" onkeypress="if(event.key === 'Enter') searchCity()">
        <button onclick="searchCity()">검색</button>
        <button onclick="getGeolocation()" title="내 위치 찾기">📍</button>
        <button onclick="toggleTheme()" title="다크모드">🌙</button>
    </div>

    <div class="card main-weather">
        <h2 id="locationName">위치 및 날씨 불러오는 중...</h2>
        <div class="temp"><span id="mainTemp">--</span>°C</div>
        <div class="desc" id="weatherDesc">--</div>
        <p><strong>체감 온도:</strong> <span id="feelsLike">--</span>°C</p>
    </div>

    <div class="grid-data">
        <div class="grid-item">
            <div>💨 바람</div>
            <strong id="windSpeed">-- km/h</strong>
        </div>
        <div class="grid-item">
            <div>💧 습도</div>
            <strong id="humidity">-- %</strong>
        </div>
    </div>

    <div class="card lifestyle-guide">
        <h3>오늘의 생활 가이드 👕</h3>
        <p id="clothesSuggestion">데이터를 분석 중입니다...</p>
        <p id="lifestyleTip">잠시만 기다려주세요.</p>
    </div>
</div>

<script>
    function init() {
        checkTheme();
        getGeolocation();
    }

    // 1. 내 위치(GPS) 기반 날씨 조회
    function getGeolocation() {
        document.getElementById('locationName').innerText = "위치 찾는 중...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetchLocationName(lat, lon); 
                    fetchWeatherData(lat, lon);  
                },
                () => {
                    alert("위치 정보를 가져올 수 없어 서울 날씨를 보여줍니다.");
                    document.getElementById('locationName').innerText = "서울";
                    fetchWeatherData(37.5665, 126.9780);
                }
            );
        }
    }

    // 2. 검색어 기반 날씨 조회 (OpenStreetMap Nominatim API 적용 - 한글 검색 강력 지원)
    async function searchCity() {
        const cityInput = document.getElementById('searchInput').value.trim();
        if (!cityInput) {
            alert("지역 이름을 입력해주세요. (예: 해운대구, 서귀포, 대전)");
            return;
        }

        document.getElementById('locationName').innerText = "검색 중...";

        try {
            // 한글 지역명 -> 위도/경도 변환 (Nominatim API)
            const geoUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityInput)}&format=json&limit=1`;
            const response = await fetch(geoUrl);
            const data = await response.json();

            if (data && data.length > 0) {
                const location = data[0];
                const lat = location.lat;
                const lon = location.lon;
                
                // 사용자가 검색한 키워드를 그대로 타이틀에 표시하여 직관성 향상
                document.getElementById('locationName').innerText = cityInput;
                
                // 해당 좌표로 날씨 조회
                fetchWeatherData(lat, lon);
            } else {
                alert(`"${cityInput}" 지역을 찾을 수 없습니다. 다시 검색해주세요.`);
                document.getElementById('locationName').innerText = "검색 실패";
            }
        } catch (error) {
            alert("지역 검색 중 오류가 발생했습니다.");
            console.error(error);
        }
    }

    // 좌표를 한글 지역명으로 변환 (GPS 조회 시 사용)
    async function fetchLocationName(lat, lon) {
        try {
            const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
            const data = await response.json();
            const locationString = data.locality || data.city || "현재 위치";
            document.getElementById('locationName').innerText = locationString;
        } catch (error) {
            document.getElementById('locationName').innerText = "현재 위치";
        }
    }

    // 날씨 가져오기
    async function fetchWeatherData(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
            const response = await fetch(url);
            const data = await response.json();
            
            updateUI(data.current);
        } catch (error) {
            alert("날씨 데이터를 가져오는데 실패했습니다.");
            console.error(error);
        }
    }

    // WMO 날씨 코드를 한글 텍스트 및 이모지로 변환
    function getWeatherDescription(code) {
        if (code === 0) return "맑음 ☀️";
        if (code === 1 || code === 2 || code === 3) return "구름 조금/흐림 ☁️";
        if (code >= 45 && code <= 48) return "안개 🌫️";
        if (code >= 51 && code <= 67) return "비 🌧️";
        if (code >= 71 && code <= 77) return "눈 ❄️";
        if (code >= 80 && code <= 82) return "소나기 ☔";
        if (code >= 95) return "천둥번개 ⛈️";
        return "알 수 없음";
    }

    // UI 업데이트 로직
    function updateUI(currentData) {
        const temp = currentData.temperature_2m;
        const feelsLike = currentData.apparent_temperature;
        const weatherDesc = getWeatherDescription(currentData.weather_code);
        
        document.getElementById('mainTemp').innerText = Math.round(temp);
        document.getElementById('feelsLike').innerText = Math.round(feelsLike);
        document.getElementById('weatherDesc').innerText = weatherDesc;
        document.getElementById('windSpeed').innerText = `${currentData.wind_speed_10m} km/h`;
        document.getElementById('humidity').innerText = `${currentData.relative_humidity_2m} %`;
        
        updateLifestyleGuide(temp, weatherDesc);
    }

    // 의상 및 생활 가이드
    function updateLifestyleGuide(temp, weatherDesc) {
        let clothes = "";
        let tip = "";

        if (temp >= 28) { clothes = "민소매, 반팔, 반바지, 린넨 옷"; }
        else if (temp >= 23) { clothes = "반팔, 얇은 셔츠, 반바지, 면바지"; }
        else if (temp >= 20) { clothes = "얇은 가디건, 긴팔, 면바지, 청바지"; }
        else if (temp >= 17) { clothes = "얇은 니트, 맨투맨, 가디건, 청바지"; }
        else if (temp >= 12) { clothes = "자켓, 가디건, 야상, 스타킹, 청바지"; }
        else if (temp >= 9) { clothes = "트렌치 코트, 야상, 점퍼, 기모바지"; }
        else if (temp >= 5) { clothes = "울 코트, 가죽자켓, 히트텍, 니트"; }
        else { clothes = "패딩, 두꺼운 코트, 목도리, 기모제품"; }

        if (weatherDesc.includes("비") || weatherDesc.includes("소나기")) {
            tip = "오늘 비 소식이 있습니다. 우산을 챙기는 것이 좋겠습니다! ☔";
        } else if (temp > 25) {
            tip = "더운 날씨입니다. 충분한 수분 섭취를 잊지 마세요. 💧";
        } else {
            tip = "야외 활동하기 좋은 날씨입니다. 좋은 하루 보내세요! 🚶‍♂️";
        }

        document.getElementById('clothesSuggestion').innerHTML = `<strong>추천 옷차림:</strong> ${clothes}`;
        document.getElementById('lifestyleTip').innerText = tip;
    }

    // 다크모드
    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute("data-theme") === "dark") {
            body.removeAttribute("data-theme");
            localStorage.setItem("theme", "light");
        } else {
            body.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
        }
    }

    function checkTheme() {
        if (localStorage.getItem("theme") === "dark") {
            document.body.setAttribute("data-theme", "dark");
        }
    }

    window.onload = init;
</script>

</body>
</html>
